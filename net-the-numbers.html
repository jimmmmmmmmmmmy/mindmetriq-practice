<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7f4f2"><title>Net the Numbers practice</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#e9e6e3;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#2f2a2a}
body{display:flex;justify-content:center;align-items:stretch;overscroll-behavior:none}
#app{width:100%;max-width:430px;min-height:100%;background:var(--bg,#f7f4f2);display:flex;flex-direction:column;position:relative;box-shadow:0 0 24px rgba(0,0,0,.08)}
.serif{font-family:Georgia,"Times New Roman",serif}
h1{font-family:Georgia,serif;font-weight:400;font-size:34px;margin:6px 0 10px;line-height:1.1}
h2{font-family:Georgia,serif;font-weight:400;font-size:24px;margin:4px 0 8px}
.cat{display:flex;align-items:center;gap:8px;font-size:14px}.cat i{width:14px;height:14px;background:var(--accent);display:inline-block}
.pad{padding:18px 18px}
.screen{display:none;flex:1;flex-direction:column}.screen.on{display:flex}
.rules{font-size:14.5px;line-height:1.45}.rules li{margin:4px 0}
.btn{appearance:none;border:1px solid #bdb6b0;background:#fff;border-radius:6px;padding:12px 14px;font-size:16px;cursor:pointer;color:inherit;touch-action:manipulation}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.modes{display:grid;gap:10px;margin-top:10px}
.modes .btn{text-align:left}.modes small{display:block;opacity:.7;font-size:12.5px;margin-top:2px}
.hud{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px;font-size:15px}
.hud .ttl{font-family:Georgia,serif}
.tbar{height:3px;background:#d8d2cd;margin:0 16px}.tbar div{height:100%;background:#3a3030;width:100%}
#stage{flex:1;display:flex;flex-direction:column;position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.foot{border-top:1px solid #d8d2cd;display:flex;justify-content:flex-end;padding:10px 14px;min-height:56px;align-items:center;gap:10px}
.flash{position:absolute;left:0;right:0;bottom:70px;text-align:center;pointer-events:none;font-size:15px;opacity:0;transition:opacity .15s}
.flash.on{opacity:1}.flash span{background:#fff;border:1px solid #ccc;padding:8px 12px;border-radius:6px;display:inline-block;max-width:92%}
.flash.ok span{border-color:#3d8b4a;color:#2c6b37}.flash.bad span{border-color:#b33;color:#9b2a2a}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat div{background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px}.stat b{display:block;font-size:24px;font-family:Georgia,serif;font-weight:400}
.stat span{font-size:12.5px;opacity:.7}
table.rev{width:100%;border-collapse:collapse;font-size:13px}table.rev td{border-bottom:1px solid #e3dedb;padding:5px 3px}
.ok{color:#2c6b37}.bad{color:#9b2a2a}
.hist{font-size:13px;opacity:.85}
a.back{color:inherit;font-size:14px}
.note{font-size:12px;opacity:.65;margin-top:10px}

.grid{display:grid;gap:6px;margin:auto;position:relative;padding:4px}
.cell{background:#d9d3d1;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;border-radius:2px}
.cell.p{background:#a35f5f}.cell.n{background:#3b2b2c}
.cell{position:relative}
.cell.in::after{content:"";position:absolute;inset:-3px;border:3px solid #8f3f3f;background:rgba(240,190,190,.38);border-radius:3px;box-shadow:0 0 8px rgba(143,63,63,.45)}
.cell.in:not(.p):not(.n){background:#e8c4c2}
.cell.best{outline:3px dashed #2c6b37;outline-offset:-3px}
.sumb{text-align:center;font-family:Georgia,serif;font-size:20px;height:28px;margin-top:8px}
</style><link rel="stylesheet" href="css/results.css"></head><body><div id="app"></div><script src="js/storage.js"></script><script src="js/game-logic.js"></script><script src="js/results.js"></script><script src="js/review.js"></script><script src="js/harness.js"></script><script>

(() => {
const N = 5; let it, pos, gridEl, cells, drag = null, showSum = false;
const { sumAt } = MMQLogic.net;
const newItem = level => MMQLogic.net.newItem(level);
function setup(stage, foot) {
  stage.innerHTML = `<div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:10px 14px"><div class="grid" id="grid"></div><div class="sumb" id="sumb"></div></div>`;
  foot.innerHTML = `<button class="btn primary" id="submit">Submit &rarr;</button>`;
  gridEl = stage.querySelector("#grid");
  gridEl.style.gridTemplateColumns = `repeat(${N},1fr)`; gridEl.style.width = "min(100%, 62vh)";
  gridEl.innerHTML = Array.from({ length: N*N }, (_, i) => `<div class="cell" data-i="${i}"></div>`).join("");
  cells = [...gridEl.children];
  foot.querySelector("#submit").onclick = submit;
  gridEl.addEventListener("pointerdown", e => { if (H.done) return; const c = cellFrom(e); if (!c) return; gridEl.setPointerCapture(e.pointerId); drag = { sx: c[0], sy: c[1], px: pos[0], py: pos[1] }; });
  gridEl.addEventListener("pointermove", e => { if (!drag) return; const c = cellFrom(e, true); if (!c) return; move(drag.px + c[0] - drag.sx, drag.py + c[1] - drag.sy, true); });
  const up = () => drag = null; gridEl.addEventListener("pointerup", up); gridEl.addEventListener("pointercancel", up);
}
function cellFrom(e, clamp) {
  const r = gridEl.getBoundingClientRect(); let x = Math.floor((e.clientX - r.left) / r.width * N), y = Math.floor((e.clientY - r.top) / r.height * N);
  if (clamp) { x = Math.max(0, Math.min(N-1, x)); y = Math.max(0, Math.min(N-1, y)); } else if (x<0||y<0||x>=N||y>=N) return null;
  return [x, y];
}
function move(x, y, abs) {
  if (H.done) return;
  if (!abs) { x += pos[0]; y += pos[1]; }
  pos = [Math.max(0, Math.min(N - it.sh.w, x)), Math.max(0, Math.min(N - it.sh.h, y))]; draw();
}
function draw(reveal) {
  const inSet = new Set(it.sh.cells.map(([dx,dy]) => (pos[1]+dy)*N + pos[0]+dx));
  const bestSet = new Set(it.sh.cells.map(([dx,dy]) => (it.bp[1]+dy)*N + it.bp[0]+dx));
  cells.forEach((c, i) => { const v = it.g[i]; c.className = "cell" + (v > 0 ? " p" : v < 0 ? " n" : "") + (inSet.has(i) ? " in" : "") + (reveal && bestSet.has(i) ? " best" : ""); c.textContent = v || ""; });
  document.getElementById("sumb").textContent = showSum ? "Net sum: " + sumAt(it.g, it.sh, pos[0], pos[1]) : "";
}
function render(item) { drag = null; it = item; pos = [Math.floor((N - it.sh.w) / 2), Math.floor((N - it.sh.h) / 2)]; showSum = false; draw(); }
function result() { const s = sumAt(it.g, it.sh, pos[0], pos[1]); return { correct: s === it.best, note: `your sum ${s}, best possible ${it.best} (see the highlighted solution in the review)` }; }
function submit() { if (H.done) return; const r = result(); if (H.mode.feedback) { showSum = true; draw(true); } H.answer(r.correct, r); }
H.init({ id: "net", title: "Net the Numbers", cat: "Numerical Reasoning", accent: "#8f4b4b", items: 12, perItem: 20, timerText: "20 s per question",
  rules: `<p>Move the net over the grid to capture the <b>highest possible sum</b>. Only the single best placement counts as correct.</p>
  <ul><li>Every number inside the net is added up. Empty tiles count as 0.</li><li>Negative tiles subtract, but sometimes you need them to reach the best sum. The best sum can itself be negative.</li>
  <li>The net moves but can't rotate or change size.</li><li>Controls: drag on the grid, or use the arrow keys. Tap <b>Submit</b> or press Enter.</li>
  <li>When time runs out, the net's current position is submitted.</li></ul>`,
  snapshot: () => ({ g: it.g, sh: it.sh, bp: it.bp, pos, best: it.best }),
  setup, newItem, render, timeout: () => { const r = result(); if (H.mode.feedback) { showSum = true; draw(true); } return r; },
  key: e => { const m = { ArrowLeft: [-1,0], ArrowRight: [1,0], ArrowUp: [0,-1], ArrowDown: [0,1] }[e.key]; if (m) move(m[0], m[1]); else if (e.key === "Enter" || e.key === " ") submit(); } });
if (new URLSearchParams(location.search).has("debug")) window.__game = { get item() { return it; }, get pos() { return pos; }, move, submit };
})();
</script></body></html>
