<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4f2"><title>Numerical Insights practice</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#e9e6e3;color:#2f2a2a}
.screen{display:none;flex:1;flex-direction:column}.screen.on{display:flex}
.btn{appearance:none;border:1px solid #bdb6b0;background:#fff;border-radius:6px;padding:12px 14px;font-size:16px;cursor:pointer;color:inherit;touch-action:manipulation}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.modes{display:grid;gap:10px;margin-top:10px}
.modes .btn{text-align:left}.modes small{display:block;opacity:.7;font-size:12.5px;margin-top:2px}
a.back{color:inherit}
</style>
<link rel="stylesheet" href="css/results.css?v=insights-20261102"><link rel="stylesheet" href="css/game.css?v=insights-20261102"></head><body><div id="app"></div>
<script src="js/storage.js?v=insights-20261102"></script>
<script src="js/battery.js?v=insights-20261102"></script>
<script src="js/game-logic.js?v=demo-20261030"></script>
<script src="js/insights-logic.js?v=insights-20261102"></script>
<script src="js/results.js?v=insights-20261102"></script>
<script src="js/solver.js?v=insights-20261102"></script><script src="js/review.js?v=insights-20261102"></script>
<script src="js/demo.js?v=insights-20261102"></script>
<script src="js/harness.js?v=insights-20261102"></script>
<script>
(() => {
const gen = MMQInsights.create();
const calc = MMQInsights.calculator();
let it;
const keys = ["7","8","9","/","4","5","6","*","1","2","3","-","0",".","%","+","C","="];
function setup(stage, foot) {
  stage.innerHTML = `<div class="insight-scroll"><div id="exhibit"></div><p id="prompt" class="prompt"></p><div id="choices" role="radiogroup" aria-label="Answers"></div></div>`;
  foot.innerHTML = `<button type="button" class="btn" id="calcToggle" aria-expanded="false" aria-controls="calcPop">Calculator</button><button type="button" class="btn primary" id="submit">Submit</button>`;
  foot.insertAdjacentHTML("afterend", `<div id="calcPop" class="calc" hidden><output id="calcOut" aria-live="polite">0</output><div class="calc-grid">${keys.map(key => `<button type="button" data-key="${key}">${key === "*" ? "×" : key === "/" ? "÷" : key === "-" ? "−" : key}</button>`).join("")}</div></div>`);
  foot.querySelector("#submit").onclick = submit;
  foot.querySelector("#calcToggle").onclick = () => {
    const pop = document.querySelector("#calcPop");
    pop.hidden = !pop.hidden;
    foot.querySelector("#calcToggle").setAttribute("aria-expanded", String(!pop.hidden));
  };
  document.querySelector("#calcPop").onclick = event => {
    const key = event.target.closest("button")?.dataset.key;
    if (!key) return;
    document.querySelector("#calcOut").textContent = calc.press(key);
  };
}
function select(index) {
  if (H.done || index < 0 || index >= it.options.length) return;
  it.selected = index;
  document.querySelectorAll(".choice").forEach((button, i) => {
    button.classList.toggle("sel", i === index);
    button.setAttribute("aria-checked", String(i === index));
  });
}
function draw() {
  document.querySelector("#exhibit").innerHTML = MMQInsights.diagram(it);
  document.querySelector("#prompt").textContent = it.prompt;
  document.querySelector("#choices").innerHTML = it.options.map((option, i) =>
    `<button type="button" class="choice" role="radio" aria-checked="${i === it.selected}" data-i="${i}">${option}</button>`).join("");
  document.querySelectorAll(".choice").forEach(button => button.onclick = () => select(Number(button.dataset.i)));
}
function render(item) { it = item; draw(); }
function submit() {
  if (!H.canSubmit) return;
  if (it.selected < 0) { H.flash("Choose an answer", "bad", 700); return; }
  if (H.mode.feedback) document.querySelectorAll(".choice").forEach((button, i) => button.classList.toggle("show-correct", i === it.answer));
  H.answer(it.selected === it.answer, { note: it.explain });
}
H.init({
  id: "insights", title: "Numerical Insights", cat: "Numerical Reasoning", accent: "#8f4b4b",
  items: 15, practiceItems: 4, perItem: 75, overallSeconds: 15 * 60, timerText: "15:00 overall",
  rules: `<p>Answer from the table, chart, or short passage. A fresh exhibit is generated for every question.</p>
  <ul><li>The timed section is <b>15 questions in 15 minutes</b>, matching the published Insights Numerical limit. Hard drill uses 11 minutes 15 seconds.</li>
  <li>Practice is four questions, 75 seconds each, with the working shown after you answer.</li>
  <li>Use the on-screen calculator. Official instructions allow a calculator for this test.</li>
  <li>Tap an answer, then Submit. Keys 1–5 select an answer and Enter submits.</li></ul>`,
  snapshot: () => it,
  setup, newItem: level => gen.newItem(level), onStart: () => gen.reset(), render,
  timeout: () => ({ correct: it.selected === it.answer, note: "Time ran out" }),
  key: event => {
    const index = "12345".indexOf(event.key);
    if (index >= 0) select(index);
    else if (event.key === "Enter") submit();
    else return false;
  }
});
if (new URLSearchParams(location.search).has("debug")) window.__game = {
  get item() { return it; },
  choose(index) { select(index); submit(); }
};
})();
</script></body></html>
