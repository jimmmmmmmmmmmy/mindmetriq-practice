<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4f2"><title>Link Swipe practice</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#e9e6e3;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#2f2a2a}
body{display:flex;justify-content:center;align-items:stretch;overscroll-behavior:none}
#app{width:100%;max-width:430px;min-height:100%;background:var(--bg,#f7f4f2);display:flex;flex-direction:column;position:relative;box-shadow:0 0 24px rgba(0,0,0,.08)}
.serif{font-family:Georgia,"Times New Roman",serif}
h1{font-family:Georgia,serif;font-weight:400;font-size:34px;margin:6px 0 10px;line-height:1.1}
h2{font-family:Georgia,serif;font-weight:400;font-size:24px;margin:4px 0 8px}
.cat{display:flex;align-items:center;gap:8px;font-size:14px}.cat i{width:14px;height:14px;background:var(--accent);display:inline-block}
.pad{padding:18px 18px}
.screen{display:none;flex:1;flex-direction:column}.screen.on{display:flex}
.rules{font-size:14.5px;line-height:1.45}.rules li{margin:4px 0}
.btn{appearance:none;border:1px solid #bdb6b0;background:#fff;border-radius:6px;padding:12px 14px;font-size:16px;cursor:pointer;color:inherit;touch-action:manipulation}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.modes{display:grid;gap:10px;margin-top:10px}
.modes .btn{text-align:left}.modes small{display:block;opacity:.7;font-size:12.5px;margin-top:2px}
.hud{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px;font-size:15px}
.hud .ttl{font-family:Georgia,serif}
.tbar{height:3px;background:#d8d2cd;margin:0 16px}.tbar div{height:100%;background:#3a3030;width:100%}
#stage{flex:1;display:flex;flex-direction:column;position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.foot{border-top:1px solid #d8d2cd;display:flex;justify-content:flex-end;padding:10px 14px;min-height:56px;align-items:center;gap:10px}
.flash{position:absolute;left:0;right:0;bottom:70px;text-align:center;pointer-events:none;font-size:15px;opacity:0;transition:opacity .15s}
.flash.on{opacity:1}.flash span{background:#fff;border:1px solid #ccc;padding:8px 12px;border-radius:6px;display:inline-block;max-width:92%}
.flash.ok span{border-color:#3d8b4a;color:#2c6b37}.flash.bad span{border-color:#b33;color:#9b2a2a}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat div{background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px}.stat b{display:block;font-size:24px;font-family:Georgia,serif;font-weight:400}
.stat span{font-size:12.5px;opacity:.7}
table.rev{width:100%;border-collapse:collapse;font-size:13px}table.rev td{border-bottom:1px solid #e3dedb;padding:5px 3px}
.ok{color:#2c6b37}.bad{color:#9b2a2a}
.hist{font-size:13px;opacity:.85}
a.back{color:inherit;font-size:14px}
.note{font-size:12px;opacity:.65;margin-top:10px}

.arrows{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;padding:16px 10px 0;gap:4px}
.arrows button{background:none;border:0;cursor:pointer;color:inherit;font-size:16px;padding:4px;touch-action:manipulation}
.tri{width:0;height:0;margin:10px auto 0;opacity:.85}
.tl{border-top:24px solid transparent;border-bottom:24px solid transparent;border-right:30px solid #cdbf8a}
.tr{border-top:24px solid transparent;border-bottom:24px solid transparent;border-left:30px solid #cdbf8a}
.td{border-left:24px solid transparent;border-right:24px solid transparent;border-top:30px solid #cdbf8a;margin-top:18px}
.card{margin:26px 18px 0;background:#fff;border:1px solid #ddd;box-shadow:0 3px 8px rgba(0,0,0,.08);text-align:center;font-family:Georgia,serif;font-size:26px;padding:4px 16px;touch-action:none;cursor:grab;transition:transform .18s,opacity .18s}
.card div{padding:16px 0}.card hr{border:0;border-top:1px solid #8a7f72;margin:0 10px}
</style><link rel="stylesheet" href="css/results.css"><link rel="stylesheet" href="css/game.css"></head><body><div id="app"></div><script src="js/storage.js"></script><script src="js/game-logic.js"></script><script src="js/verbal-data.js"></script><script src="js/verbal-logic.js"></script><script src="js/results.js"></script><script src="js/review.js"></script><script src="js/demo.js"></script><script src="js/harness.js"></script><script>

(() => {
const verbal = MMQVerbal.create();
const LAB = { A: "Almost opposite", N: "Other", S: "Almost the same" };
let it, card, drag = null;
const newItem = level => verbal.swipe(level);
function setup(stage, foot) {
  stage.innerHTML = `<div class="arrows">
   <button data-a="A">Almost<br>opposite<div class="tri tl"></div></button>
   <button data-a="N">Other<div class="tri td"></div></button>
   <button data-a="S">Almost<br>the same<div class="tri tr"></div></button></div>
   <div class="card" id="card" tabindex="0" role="group" aria-label="Word pair. Left for opposite, down for other, right for similar."><div id="w1"></div><hr><div id="w2"></div></div>`;
  stage.querySelectorAll("[data-a]").forEach(b => b.onclick = () => choose(b.dataset.a));
  card = stage.querySelector("#card");
  card.addEventListener("pointerdown", e => { if (H.done) return; card.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY }; card.style.transition = "none"; });
  card.addEventListener("pointermove", e => { if (H.done || !drag) return; const dx = e.clientX - drag.x, dy = Math.max(0, e.clientY - drag.y); card.style.transform = `translate(${dx}px,${dy}px) rotate(${dx / 20}deg)`; });
  const up = e => { if (H.done || !drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag = null; card.style.transition = "";
    const threshold = document.getElementById("app").clientWidth / 3;
    if (Math.abs(dx) > threshold && Math.abs(dx) > dy) choose(dx < 0 ? "A" : "S"); else if (dy > threshold) choose("N"); else card.style.transform = ""; };
  card.addEventListener("pointerup", up); card.addEventListener("pointercancel", () => { drag = null; card.style.transform = ""; });
  foot.innerHTML = `<span style="font-size:13px;opacity:.65;margin-right:auto">Swipe the card, tap an arrow, or use the ← ↓ → keys</span>`;
}
function render(p) { drag = null; it = p; card.style.transition = "none"; card.style.transform = ""; card.style.opacity = 1; card.offsetWidth; card.style.transition = "";
  document.getElementById("w1").textContent = cap(p[0]); document.getElementById("w2").textContent = cap(p[1]); }
const cap = s => s[0].toUpperCase() + s.slice(1);
function choose(a) {
  if (H.done) return;
  card.style.transform = a === "A" ? "translate(-140%,0) rotate(-12deg)" : a === "S" ? "translate(140%,0) rotate(12deg)" : "translate(0,140%)"; card.style.opacity = 0;
  H.answer(a === it[2], { note: `answer: ${LAB[it[2]]}`, picked: a });
}
H.init({ id: "swipe", title: "Link Swipe", cat: "Verbal Reasoning", accent: "#8c7a3c", bg: "#f6f5f1", items: 15, practiceItems: 4, perItem: 6, timerText: "6 s per pair",
  rules: `<p>Compare the two words. Decide whether their meanings are <b>almost the same</b>, <b>almost the opposite</b>, or have some <b>other</b> relationship.</p>
  <ul><li>Swipe <b>right</b> for almost the same, <b>left</b> for almost opposite, and <b>down</b> for other.</li><li>Related-but-different pairs, like lock / key or teacher / student, count as <b>other</b>.</li>
  <li>Controls: swipe or drag the card, tap the arrows, or press ← ↓ →.</li></ul>`,
  snapshot: info => ({ words: it.slice(0,2), answer: it[2], picked: info.picked || null }),
  setup, newItem, render, onStart: () => verbal.reset(),
  timeout: () => ({ correct: false, note: `answer: ${LAB[it[2]]}` }),
  key: e => { const m = { ArrowLeft: "A", ArrowDown: "N", ArrowRight: "S" }[e.key]; if (m) choose(m); } });
if (new URLSearchParams(location.search).has("debug")) window.__game = { get item() { return it; }, choose };
})();
</script></body></html>
