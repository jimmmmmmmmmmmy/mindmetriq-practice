[project]
name = "practice-solver"
version = "0.1.0"
description = "Offline solvers for puzzles generated by this repository"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
practice-solver = "practice_solver.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
practice_solver = ["data/*.json", "weights/*.pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
