<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4f2"><title>Shape Spinner practice</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#e9e6e3;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#2f2a2a}
body{display:flex;justify-content:center;align-items:stretch;overscroll-behavior:none}
#app{width:100%;max-width:430px;min-height:100%;background:var(--bg,#f7f4f2);display:flex;flex-direction:column;position:relative;box-shadow:0 0 24px rgba(0,0,0,.08)}
.serif{font-family:Georgia,"Times New Roman",serif}
h1{font-family:Georgia,serif;font-weight:400;font-size:34px;margin:6px 0 10px;line-height:1.1}
h2{font-family:Georgia,serif;font-weight:400;font-size:24px;margin:4px 0 8px}
.cat{display:flex;align-items:center;gap:8px;font-size:14px}.cat i{width:14px;height:14px;background:var(--accent);display:inline-block}
.pad{padding:18px 18px}
.screen{display:none;flex:1;flex-direction:column}.screen.on{display:flex}
.rules{font-size:14.5px;line-height:1.45}.rules li{margin:4px 0}
.btn{appearance:none;border:1px solid #bdb6b0;background:#fff;border-radius:6px;padding:12px 14px;font-size:16px;cursor:pointer;color:inherit;touch-action:manipulation}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.modes{display:grid;gap:10px;margin-top:10px}
.modes .btn{text-align:left}.modes small{display:block;opacity:.7;font-size:12.5px;margin-top:2px}
.hud{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px;font-size:15px}
.hud .ttl{font-family:Georgia,serif}
.tbar{height:3px;background:#d8d2cd;margin:0 16px}.tbar div{height:100%;background:#3a3030;width:100%}
#stage{flex:1;display:flex;flex-direction:column;position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.foot{border-top:1px solid #d8d2cd;display:flex;justify-content:flex-end;padding:10px 14px;min-height:56px;align-items:center;gap:10px}
.flash{position:absolute;left:0;right:0;bottom:70px;text-align:center;pointer-events:none;font-size:15px;opacity:0;transition:opacity .15s}
.flash.on{opacity:1}.flash span{background:#fff;border:1px solid #ccc;padding:8px 12px;border-radius:6px;display:inline-block;max-width:92%}
.flash.ok span{border-color:#3d8b4a;color:#2c6b37}.flash.bad span{border-color:#b33;color:#9b2a2a}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat div{background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px}.stat b{display:block;font-size:24px;font-family:Georgia,serif;font-weight:400}
.stat span{font-size:12.5px;opacity:.7}
table.rev{width:100%;border-collapse:collapse;font-size:13px}table.rev td{border-bottom:1px solid #e3dedb;padding:5px 3px}
.ok{color:#2c6b37}.bad{color:#9b2a2a}
.hist{font-size:13px;opacity:.85}
a.back{color:inherit;font-size:14px}
.note{font-size:12px;opacity:.65;margin-top:10px}

svg{display:block;margin:auto;width:min(100%,58vh);touch-action:none}
.wheel{cursor:grab}
</style><link rel="stylesheet" href="css/results.css"><link rel="stylesheet" href="css/game.css"></head><body><div id="app"></div><script src="js/storage.js"></script><script src="js/game-logic.js"></script><script src="js/results.js"></script><script src="js/review.js"></script><script src="js/demo.js"></script><script src="js/harness.js"></script><script>

(() => {
const FILL = { d: "#2f3437", w: "#ffffff", g: "#9aa3ab" };
let it, rot = 0, ang = 0, drag = null, svg, wheelG;
const step = () => 360 / it.n;
const { valid } = MMQLogic.spinner;
const newItem = level => MMQLogic.spinner.newItem(level);
function sym(o, x, y, rotDeg, size = 22) {
  const st = `fill="${FILL[o.f]}" stroke="${o.f === "w" ? "#aab" : FILL[o.f]}" stroke-width="2"`;
  const t = `transform="translate(${x},${y}) rotate(${rotDeg})"`;
  if (o.s === "c") return `<circle cx="${x}" cy="${y}" r="${size * .9}" ${st}/>`;
  if (o.s === "s") return `<rect x="${-size * .75}" y="${-size * .75}" width="${size * 1.5}" height="${size * 1.5}" ${st} ${t}/>`;
  if (o.s === "r") return `<rect x="${-size * .65}" y="${-size * .65}" width="${size * 1.3}" height="${size * 1.3}" ${st} transform="translate(${x},${y}) rotate(${rotDeg + 45})"/>`;
  return `<polygon points="0,${size} ${-size * .95},${-size * .7} ${size * .95},${-size * .7}" ${st} ${t}/>`; // triangle; tip points toward the centre
}
const pol = (deg, r) => [r * Math.sin(deg * Math.PI / 180), -r * Math.cos(deg * Math.PI / 180)];
function draw() {
  const n = it.n, s = step(), R = 150, rIn = 110, size = n > 6 ? 20 : 25.5;
  let o = ""; it.outer.forEach((q, i) => { const a = i * s, [x, y] = pol(a, R + 40); o += sym(q, x, y, a, size); });
  let w = `<circle r="${R}" fill="#d7dee5" stroke="#b9c3cc" stroke-width="2"/>`;
  it.inner.forEach((q, j) => { const a = j * s, [x, y] = pol(a, rIn); w += sym(q, x, y, a + 180, size); });
  document.getElementById("outer").innerHTML = o; wheelG.innerHTML = w; setAng();
}
function setAng() { wheelG.setAttribute("transform", `rotate(${ang})`); svg.setAttribute("aria-label", `Inner wheel: ${Math.round(ang/step())} steps clockwise, ${it.n} symbol pairs. Arrow keys rotate; Enter submits.`); }
function snap() { rot = ((Math.round(ang / step()) % it.n) + it.n) % it.n; ang = Math.round(ang / step()) * step(); setAng(); }
function turn(d) { if (H.done) return; ang += d * step(); snap(); }
function setup(stage, foot) {
  stage.innerHTML = `<div style="flex:1;display:flex;align-items:center;padding:8px"><svg id="svg" viewBox="-225 -225 450 450" tabindex="0" role="img" aria-label="Rotate the inner wheel. Use left and right arrow keys, then Enter to submit."><g id="outer"></g><g id="wheel" class="wheel"></g></svg></div>`;
  foot.innerHTML = `<button class="btn" id="l" aria-label="rotate left">&larr;</button><button class="btn" id="r" aria-label="rotate right">&rarr;</button><span style="flex:1"></span><button class="btn primary" id="submit">Submit</button>`;
  svg = stage.querySelector("#svg"); wheelG = stage.querySelector("#wheel");
  foot.querySelector("#l").onclick = () => turn(-1); foot.querySelector("#r").onclick = () => turn(1); foot.querySelector("#submit").onclick = submit;
  const angOf = e => { const b = svg.getBoundingClientRect(); return Math.atan2(e.clientX - (b.left + b.width / 2), -(e.clientY - (b.top + b.height / 2))) * 180 / Math.PI; };
  svg.addEventListener("pointerdown", e => { if (H.done) return; svg.setPointerCapture(e.pointerId); drag = { a0: angOf(e), g0: ang }; });
  svg.addEventListener("pointermove", e => { if (H.done || !drag) return; let d = angOf(e) - drag.a0; ang = drag.g0 + d; setAng(); });
  const up = () => { if (H.done || !drag) { drag = null; return; } drag = null; snap(); }; svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
}
function render(item) { drag = null; it = item; ang = 0; rot = 0; draw(); }
function result() { drag = null; snap(); const c = valid(it.inner, it.outer, rot); return { correct: c, rotation: rot, note: `the correct position was ${it.sol} step(s) clockwise from the start` }; }
function submit() { if (!H.canSubmit) return; const r = result(); if (H.mode.feedback && !r.correct) { ang = it.sol * step(); rot = it.sol; setAng(); } H.answer(r.correct, r); }
H.init({ id: "spinner", title: "Shape Spinner", cat: "Logical Reasoning", accent: "#3e4b57", bg: "#eef1f4", items: 10, perItem: 12, submitDelay: 1, timerText: "12 s per question",
  rules: `<p>Rotate the inner wheel to find the <b>one</b> position where every inner shape sits next to an outer shape that has <b>either the same shape or the same shading, but not both</b>.</p>
  <ul><li>Same shape and same shading: incorrect. Different shape and different shading: also incorrect.</li><li>Check every pair before you submit.</li>
  <li>Harder levels add more positions, a diamond shape, and a grey shading.</li>
  <li>Controls: drag the wheel round, or tap the ← → buttons or press the ← → keys. Tap <b>Submit</b> or press Enter. When time runs out, the current position is submitted.</li></ul>`,
  snapshot: info => ({ n: it.n, inner: it.inner, outer: it.outer, sol: it.sol, rot: info.rotation ?? rot }),
  setup, newItem, render, timeout: () => result(),
  key: e => { if (e.key === "ArrowLeft") turn(-1); else if (e.key === "ArrowRight") turn(1); else if (e.key === "Enter" || e.key === " ") submit(); } });
if (new URLSearchParams(location.search).has("debug")) window.__game = { get item() { return it; }, get rot() { return rot; }, turn, submit };
})();
</script></body></html>
